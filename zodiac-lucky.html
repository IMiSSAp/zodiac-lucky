<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
  <title>今日幸运生肖开奖台</title>
  <style>
    :root {
      --gold: #ffd86b;
      --gold-deep: #ffb300;
      --hot-pink: #ff4db8;
      --cyan: #59f6ff;
      --panel: rgba(10, 13, 35, 0.68);
      --text: #fff3d9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, #5216aa 0%, #140f33 36%, #060611 100%);
    }

    .aurora {
      position: fixed;
      inset: -20%;
      filter: blur(72px);
      pointer-events: none;
      animation: float 9s ease-in-out infinite alternate;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 88, 214, 0.35), transparent 38%),
        radial-gradient(circle at 70% 25%, rgba(92, 194, 255, 0.3), transparent 42%),
        radial-gradient(circle at 60% 70%, rgba(255, 201, 78, 0.26), transparent 44%);
    }

    .container {
      position: relative;
      width: min(960px, 94vw);
      margin: 4vh auto;
      padding: 28px 22px 28px;
      border-radius: 24px;
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(255, 156, 70, 0.2), inset 0 0 36px rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .title {
      margin: 8px 0 8px;
      text-align: center;
      font-size: clamp(24px, 4vw, 42px);
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 207, 102, 0.7);
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #ffeec6;
      opacity: 0.9;
      font-size: 15px;
    }

    .jackpot-ring {
      position: relative;
      margin: 6px auto 18px;
      width: min(360px, 72vw);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.16) 0 36%, transparent 52%),
        conic-gradient(from 90deg, #ff9d00, #ffe38d, #ff50b1, #5ce8ff, #ffd75f, #ff9d00);
      box-shadow: 0 0 32px rgba(255, 177, 64, 0.45);
      display: grid;
      place-items: center;
    }

    .jackpot-ring::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(6, 9, 24, 0.95), rgba(31, 12, 49, 0.9));
      border: 1px solid rgba(255, 225, 151, 0.45);
      box-shadow: inset 0 0 20px rgba(255, 199, 110, 0.3);
    }

    .core {
      position: relative;
      z-index: 1;
      text-align: center;
      width: 72%;
    }

    .label {
      margin: 0;
      font-size: 13px;
      color: #ffe8ab;
      opacity: 0.9;
    }

    .value {
      margin: 6px 0 10px;
      font-size: clamp(34px, 6vw, 56px);
      font-weight: 800;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 16px rgba(255, 210, 94, 0.75);
    }

    .number {
      margin: 0;
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 700;
      color: #9efcff;
      text-shadow: 0 0 16px rgba(89, 246, 255, 0.7);
    }

    .controls {
      display: grid;
      place-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: 0;
      cursor: pointer;
      color: #2e1500;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffd24f, #ff9a4f, #ff5e8d);
      box-shadow: 0 8px 20px rgba(255, 128, 76, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 14px 26px rgba(255, 128, 76, 0.6);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .hint {
      margin: 0;
      font-size: 13px;
      color: rgba(255, 235, 197, 0.84);
      text-align: center;
    }

    .burst .jackpot-ring {
      animation: jackpotPulse 0.85s ease-out;
      transform: scale(1.04);
      box-shadow: 0 0 48px rgba(255, 233, 145, 0.85);
    }

    .spark {
      position: absolute;
      left: 50%;
      top: 56%;
      width: 8px;
      height: 14px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transform-origin: center;
      animation: confetti 1300ms ease-out forwards;
    }

    #starCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes float {
      0% { transform: translate(-2%, -1%) scale(1); }
      100% { transform: translate(3%, 2%) scale(1.08); }
    }

    @keyframes jackpotPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.06); }
      100% { transform: scale(1.04); }
    }

    @keyframes confetti {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(0deg) scale(0.8);
      }
      8% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1.15);
      }
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }

      .container {
        width: min(96vw, 560px);
        margin: max(12px, env(safe-area-inset-top)) auto max(12px, env(safe-area-inset-bottom));
        padding: 18px 14px calc(16px + env(safe-area-inset-bottom));
        border-radius: 18px;
      }

      .title {
        margin-top: 2px;
        margin-bottom: 6px;
        letter-spacing: 1px;
      }

      .subtitle {
        font-size: 13px;
        margin-bottom: 16px;
      }

      .jackpot-ring {
        width: min(320px, 82vw);
        margin: 4px auto 14px;
      }

      .jackpot-ring::before {
        inset: 14px;
      }

      .label {
        font-size: 12px;
      }

      .value {
        margin: 4px 0 8px;
        font-size: clamp(30px, 9vw, 42px);
      }

      .number {
        font-size: clamp(24px, 8vw, 38px);
      }

      button {
        width: min(88vw, 320px);
        min-height: 46px;
        font-size: 16px;
        padding: 10px 20px;
      }

      .hint {
        width: 92%;
        font-size: 12px;
        line-height: 1.45;
      }
    }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>
  <div class="aurora"></div>

  <main class="container" id="stage">
    <h1 class="title">十二生肖 · 今日幸运开奖台</h1>
    <p class="subtitle" id="dateText">正在对齐天机...</p>

    <section class="jackpot-ring">
      <div class="core">
        <p class="label">今日幸运生肖</p>
        <h2 class="value" id="zodiacValue">---</h2>
        <p class="label">幸运数字 (1-50)</p>
        <p class="number" id="numberValue">--</p>
      </div>
    </section>

    <div class="controls">
      <button id="drawBtn">立即开奖</button>
      <p class="hint">同一天结果固定，明天自动刷新新运势。音效和震动默认开启。</p>
    </div>
  </main>

  <script>
    const zodiacList = ["鼠", "牛", "虎", "兔", "龙", "蛇", "马", "羊", "猴", "鸡", "狗", "猪"];
    const zodiacValue = document.getElementById("zodiacValue");
    const numberValue = document.getElementById("numberValue");
    const drawBtn = document.getElementById("drawBtn");
    const stage = document.getElementById("stage");
    const dateText = document.getElementById("dateText");
    const soundEnabled = true;
    const vibrationEnabled = true;
    let audioCtx = null;

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    // 顶级日运算法：FNV-1a 64 位种子 + SplitMix64，分布更均匀、同天可复现。
    function dailyFortune(date = new Date()) {
      const dateKey = formatDateKey(date);
      const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
      const seedText = `${dateKey}|${dayOfYear}|${date.getDay()}|${zodiacList.join("")}`;
      let state = fnv1a64(seedText);

      const nextRand64 = () => {
        state = (state + 0x9e3779b97f4a7c15n) & 0xffffffffffffffffn;
        let z = state;
        z = ((z ^ (z >> 30n)) * 0xbf58476d1ce4e5b9n) & 0xffffffffffffffffn;
        z = ((z ^ (z >> 27n)) * 0x94d049bb133111ebn) & 0xffffffffffffffffn;
        return (z ^ (z >> 31n)) & 0xffffffffffffffffn;
      };

      const zodiacIndex = Number(nextRand64() % 12n);
      const luckyNumber = Number(nextRand64() % 50n) + 1;

      return {
        dateKey,
        zodiac: zodiacList[zodiacIndex],
        number: luckyNumber
      };
    }

    function fnv1a64(text) {
      let hash = 0xcbf29ce484222325n;
      const prime = 0x100000001b3n;
      for (let i = 0; i < text.length; i++) {
        hash ^= BigInt(text.charCodeAt(i));
        hash = (hash * prime) & 0xffffffffffffffffn;
      }
      return hash;
    }

    function animateReveal(result) {
      drawBtn.disabled = true;
      playDrawSound();
      fireVibration([20, 35, 20]);
      let frame = 0;

      const timer = setInterval(() => {
        frame++;
        zodiacValue.textContent = zodiacList[Math.floor(Math.random() * zodiacList.length)];
        numberValue.textContent = String(1 + Math.floor(Math.random() * 50)).padStart(2, "0");
        if (frame >= 18) {
          clearInterval(timer);
          zodiacValue.textContent = result.zodiac;
          numberValue.textContent = String(result.number).padStart(2, "0");
          stage.classList.add("burst");
          launchConfetti(88);
          playWinSound();
          fireVibration([50, 40, 100]);
          setTimeout(() => stage.classList.remove("burst"), 1300);
          setTimeout(() => (drawBtn.disabled = false), 650);
        }
      }, 90);
    }

    function getAudioCtx() {
      if (!soundEnabled) return null;
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function beep(freq, duration, type = "sine", gainValue = 0.06) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(gainValue, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    function playDrawSound() {
      if (!soundEnabled) return;
      beep(620, 0.09, "triangle", 0.05);
      setTimeout(() => beep(780, 0.1, "triangle", 0.05), 80);
    }

    function playWinSound() {
      if (!soundEnabled) return;
      beep(660, 0.13, "sine", 0.06);
      setTimeout(() => beep(880, 0.14, "sine", 0.06), 120);
      setTimeout(() => beep(1180, 0.16, "sine", 0.07), 240);
    }

    function fireVibration(pattern) {
      if (!vibrationEnabled) return;
      if (typeof navigator.vibrate === "function") {
        navigator.vibrate(pattern);
      }
    }

    function launchConfetti(count) {
      for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.className = "spark";
        piece.style.background = ["#ffe16e", "#ff84b8", "#63efff", "#ffffff"][i % 4];
        piece.style.setProperty("--x", `${(Math.random() - 0.5) * 90}vw`);
        piece.style.setProperty("--y", `${(-20 - Math.random() * 65)}vh`);
        piece.style.setProperty("--r", `${Math.random() * 560 - 280}deg`);
        piece.style.animationDelay = `${Math.random() * 220}ms`;
        stage.appendChild(piece);
        setTimeout(() => piece.remove(), 1500);
      }
    }

    function initStars() {
      const canvas = document.getElementById("starCanvas");
      const ctx = canvas.getContext("2d");
      const stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars.length = 0;
        const count = Math.max(80, Math.floor((canvas.width * canvas.height) / 12000));
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.9 + 0.3,
            alpha: Math.random() * 0.8 + 0.2,
            speed: Math.random() * 0.015 + 0.005
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          s.alpha += (Math.random() - 0.5) * s.speed;
          if (s.alpha < 0.2) s.alpha = 0.2;
          if (s.alpha > 1) s.alpha = 1;
          ctx.beginPath();
          ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      resize();
      draw();
      window.addEventListener("resize", resize);
    }

    const todayResult = dailyFortune();
    dateText.textContent = `今日日期：${todayResult.dateKey}（同一天开奖结果固定）`;
    zodiacValue.textContent = todayResult.zodiac;
    numberValue.textContent = String(todayResult.number).padStart(2, "0");

    drawBtn.addEventListener("click", () => animateReveal(todayResult));
    initStars();
  </script>
</body>
</html>
